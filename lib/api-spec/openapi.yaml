openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading
    description: Paper trading dashboard data
  - name: broker
    description: Broker and MT5 bridge readiness
  - name: v72
    description: V7.2 decision engine, Axi protection, and decision memory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [trading]
      summary: Get paper trading dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /markets:
    get:
      operationId: getMarkets
      tags: [trading]
      summary: List tracked markets
      responses:
        "200":
          description: Market snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"
  /opportunities:
    get:
      operationId: getOpportunities
      tags: [trading]
      summary: List ranked paper opportunities
      responses:
        "200":
          description: Ranked opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
  /news:
    get:
      operationId: getNews
      tags: [trading]
      summary: Get classified live market news
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string }
        - name: theme
          in: query
          required: false
          schema: { type: string }
        - name: horizon
          in: query
          required: false
          schema: { type: string, enum: [short, medium, long] }
        - name: locale
          in: query
          required: false
          schema: { type: string, enum: [it, en] }
      responses:
        "200":
          description: Classified news snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeed"
  /assets/{symbol}:
    get:
      operationId: getAssetAnalysis
      tags: [trading]
      summary: Get explainable asset analysis
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          required: false
          schema: { type: string, enum: [it, en] }
      responses:
        "200":
          description: Asset analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAnalysis"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /axi/rules:
    get:
      operationId: getAxiRules
      tags: [v72]
      summary: Get the active Axi stage rules
      responses:
        "200":
          description: Active Axi rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AxiRulesSnapshot" }
  /axi/progress:
    get:
      operationId: getAxiProgress
      tags: [v72]
      summary: Get the current PAPER Axi progression state
      responses:
        "200":
          description: Axi PAPER progression and protection state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AxiProgressResult" }
  /v72/opportunities-style:
    get:
      operationId: getV72Opportunities
      tags: [v72]
      summary: Get V7.2 ranked paper opportunities
      parameters:
        - name: locale
          in: query
          required: false
          schema: { type: string, enum: [it, en] }
      responses:
        "200":
          description: Opportunities ranked by the V7.2 engine
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RankedOpportunity" }
  /decision-memory:
    post:
      operationId: createDecisionMemory
      tags: [v72]
      summary: Persist a PAPER decision proposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionMemoryInput" }
      responses:
        "201":
          description: Persisted decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionMemory" }
        "400": { description: Invalid decision memory input }
  /decision-memory/{externalId}/outcome:
    patch:
      operationId: updateDecisionMemoryOutcome
      tags: [v72]
      summary: Record the outcome of a PAPER decision
      parameters:
        - name: externalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionMemoryOutcomeInput" }
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionMemory" }
        "404": { description: Decision memory record not found }
  /decision-memory/recent:
    get:
      operationId: getRecentDecisionMemory
      tags: [v72]
      summary: List recent PAPER decisions
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent decisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DecisionMemory" }
  /broker/status:
    get:
      operationId: getBrokerStatus
      tags: [broker]
      summary: Get Axi MT5 bridge readiness
      responses:
        "200":
          description: Broker connection and execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerStatus"
  /broker/quotes:
    get:
      operationId: getBrokerQuotes
      tags: [broker]
      summary: Get normalized MT5 quotes
      security:
        - BrokerReadKey: []
      parameters:
        - name: symbols
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Normalized quote snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NormalizedQuote" }
        "401": { $ref: "#/components/responses/BrokerReadUnauthorized" }
        "403": { $ref: "#/components/responses/BrokerReadForbidden" }
        "502": { $ref: "#/components/responses/BridgeProtocolFailure" }
        "503": { $ref: "#/components/responses/BridgeUnavailable" }
  /broker/account:
    get:
      operationId: getBrokerAccount
      tags: [broker]
      summary: Get normalized MT5 account snapshot
      security:
        - BrokerReadKey: []
      responses:
        "200":
          description: Normalized account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSnapshot" }
        "401": { $ref: "#/components/responses/BrokerReadUnauthorized" }
        "403": { $ref: "#/components/responses/BrokerReadForbidden" }
        "502": { $ref: "#/components/responses/BridgeProtocolFailure" }
        "503": { $ref: "#/components/responses/BridgeUnavailable" }
  /broker/positions:
    get:
      operationId: getBrokerPositions
      tags: [broker]
      summary: Get normalized MT5 positions
      security:
        - BrokerReadKey: []
      responses:
        "200":
          description: Normalized positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NormalizedPosition" }
        "401": { $ref: "#/components/responses/BrokerReadUnauthorized" }
        "403": { $ref: "#/components/responses/BrokerReadForbidden" }
        "502": { $ref: "#/components/responses/BridgeProtocolFailure" }
        "503": { $ref: "#/components/responses/BridgeUnavailable" }
  /broker/history:
    get:
      operationId: getBrokerHistory
      tags: [broker]
      summary: Get normalized MT5 trade history
      security:
        - BrokerReadKey: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Normalized history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NormalizedHistoryEntry" }
        "401": { $ref: "#/components/responses/BrokerReadUnauthorized" }
        "403": { $ref: "#/components/responses/BrokerReadForbidden" }
        "502": { $ref: "#/components/responses/BridgeProtocolFailure" }
        "503": { $ref: "#/components/responses/BridgeUnavailable" }
  /broker/mt5/heartbeat:
    post:
      operationId: submitMt5Heartbeat
      tags: [broker]
      summary: Record an authenticated MT5 bridge heartbeat
      security:
        - Mt5BridgeKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mt5BridgeHeartbeat" }
      responses:
        "204": { description: Heartbeat recorded }
        "400": { description: Invalid heartbeat }
        "401": { description: Missing or invalid bridge key }
        "403": { description: Bridge network is not allowlisted }
  /decision/evaluate:
    post:
      operationId: evaluateDecision
      tags: [trading]
      summary: Evaluate a PAPER decision with the V7.1 master engine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterDecisionInput" }
      responses:
        "200":
          description: Explainable master decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterDecisionResult" }
        "400": { description: Invalid decision input }
  /axi/protection/evaluate:
    post:
      operationId: evaluateAxiProtection
      tags: [trading]
      summary: Evaluate PAPER sizing protection against Axi progress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AxiProgressInput" }
      responses:
        "200":
          description: Axi protection state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AxiProtectionResult" }
  /opportunities/rank:
    post:
      operationId: rankV72Opportunities
      tags: [trading]
      summary: Rank PAPER opportunities with the V7.2 engines
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityRankingInput" }
      responses:
        "200":
          description: V7.2 ranked opportunities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RankedOpportunity" }
components:
  responses:
    BrokerReadUnauthorized:
      description: Missing or invalid broker read key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BrokerReadForbidden:
      description: Broker read network is not allowlisted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BridgeProtocolFailure:
      description: Bridge returned malformed or rejected protocol data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BridgeUnavailable:
      description: Bridge is unavailable or read access is not configured
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    Mt5BridgeKey:
      type: apiKey
      in: header
      name: x-mt5-bridge-key
    BrokerReadKey:
      type: apiKey
      in: header
      name: x-broker-read-key
  schemas:
    BrainSignal:
      type: object
      properties:
        score: { type: ["number", "null"] }
        confidence: { type: ["number", "null"] }
    SafetyContext:
      type: object
      properties:
        dailyLossPct: { type: ["number", "null"] }
        drawdownPct: { type: ["number", "null"] }
        consecutiveLosses: { type: ["number", "null"] }
        volatilityShockMultiple: { type: ["number", "null"] }
        spreadMultiple: { type: ["number", "null"] }
        slippageMultiple: { type: ["number", "null"] }
        dataHealth: { type: string, enum: [OK, DEGRADED, STALE, INVALID] }
        brokerConnected: { type: ["boolean", "null"] }
        portfolioCorrelation: { type: ["number", "null"] }
        minutesToHighImpactEvent: { type: ["number", "null"] }
        riskScore: { type: ["number", "null"] }
    FundamentalInput:
      type: object
      required: [price]
      properties:
        price: { type: number }
        epsTtm: { type: ["number", "null"] }
        epsForward: { type: ["number", "null"] }
        expectedEpsGrowthPct: { type: ["number", "null"] }
        revenueGrowthPct: { type: ["number", "null"] }
        operatingMarginPct: { type: ["number", "null"] }
        roePct: { type: ["number", "null"] }
        debtToEquity: { type: ["number", "null"] }
        sectorPeMedian: { type: ["number", "null"] }
    MasterDecisionInput:
      type: object
      required: [horizon, technical, macroNews]
      properties:
        horizon: { type: string, enum: [intraday, swing, position] }
        technical: { $ref: "#/components/schemas/BrainSignal" }
        macroNews: { $ref: "#/components/schemas/BrainSignal" }
        fundamentals: { $ref: "#/components/schemas/FundamentalInput" }
        statistical:
          type: object
          additionalProperties: true
        safety: { $ref: "#/components/schemas/SafetyContext" }
    MasterDecisionResult:
      type: object
      required: [confidence, decision, sizeMultiplier, hardVeto, hardVetoReasons, softGuards, weightsUsed, brainScores, rationale]
      properties:
        finalScore: { type: ["number", "null"] }
        confidence: { type: number }
        decision: { type: string, enum: [BUY, SELL, WAIT, NO_TRADE] }
        sizeMultiplier: { type: number }
        hardVeto: { type: boolean }
        hardVetoReasons:
          type: array
          items: { type: string }
        softGuards:
          type: array
          items: { type: string }
        weightsUsed:
          type: object
          additionalProperties: { type: number }
        brainScores:
          type: object
          additionalProperties: { type: ["number", "null"] }
        fundamental:
          type: ["object", "null"]
          additionalProperties: true
        statistical:
          type: ["object", "null"]
          additionalProperties: true
        rationale: { type: string }
    AxiProgressInput:
      type: object
      required: [stage]
      properties:
        stage: { type: string, enum: [PRE_SEED, SEED, INCUBATION, ACCELERATION, PRO, PRO_500, PRO_M] }
        allocationStartBalance: { type: ["number", "null"] }
        allocationEquity: { type: ["number", "null"] }
        accountEquityUsd: { type: ["number", "null"] }
        edgeScore: { type: ["number", "null"] }
        closedTrades: { type: ["number", "null"] }
        stageDays: { type: ["number", "null"] }
        monthStartEquity: { type: ["number", "null"] }
        currentEquity: { type: ["number", "null"] }
        peakMonthlyProfitPct: { type: ["number", "null"] }
    AxiProtectionResult:
      type: object
      required: [mode, baseSizeMultiplier, targetReached, progressionReady, rules, reasons]
      properties:
        mode: { type: string, enum: [NORMAL, PROFIT_LOCK_ACTIVE, RECOVERY, CAPITAL_PRESERVATION] }
        baseSizeMultiplier: { type: number }
        monthlyProfitPct: { type: ["number", "null"] }
        stageProfitPct: { type: ["number", "null"] }
        targetReached: { type: boolean }
        tradesReached: { type: boolean }
        daysReached: { type: boolean }
        edgeReached: { type: boolean }
        equityReached: { type: boolean }
        progressionReady: { type: boolean }
        rules: { $ref: "#/components/schemas/AxiStageRules" }
        reasons:
          type: array
          items: { type: string }
    OpportunityCandidate:
      type: object
      required: [symbol, masterInput]
      properties:
        symbol: { type: string }
        expectedReturnR: { type: ["number", "null"] }
        expectedRiskR: { type: ["number", "null"] }
        confidence: { type: ["number", "null"] }
        liquidityScore: { type: ["number", "null"] }
        executionCostR: { type: ["number", "null"] }
        portfolioCorrelation: { type: ["number", "null"] }
        sectorConcentrationPct: { type: ["number", "null"] }
        masterInput: { $ref: "#/components/schemas/MasterDecisionInput" }
    OpportunityRankingInput:
      type: object
      required: [candidates, axi, crash]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/OpportunityCandidate" }
        axi: { $ref: "#/components/schemas/AxiProgressInput" }
        crash:
          type: object
          additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Market:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        assetClass: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        sparkline:
          type: array
          items: { type: number }
        status: { type: string }
      required: [symbol, name, assetClass, price, change, changePercent, sparkline, status]
    Opportunity:
      type: object
      properties:
        symbol: { type: string }
        signal: { type: string }
        confidence: { type: number }
        risk: { type: string }
        state: { type: string }
        rationale: { type: string }
      required: [symbol, signal, confidence, risk, state, rationale]
    BrainScore:
      type: object
      properties:
        direction: { type: string }
        score: { type: number }
        confidence: { type: number }
        rationale: { type: string }
      required: [direction, score, confidence, rationale]
    AssetAnalysis:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        price: { type: number }
        decision: { type: string }
        confidence: { type: number }
        riskLevel: { type: string }
        regime: { type: string }
        explanation: { type: string }
        technical: { $ref: "#/components/schemas/BrainScore" }
        fundamental: { $ref: "#/components/schemas/BrainScore" }
        risk: { $ref: "#/components/schemas/BrainScore" }
        indicators:
          type: object
          additionalProperties: { type: number }
        invalidation: { type: string }
        news:
          type: array
          items: { $ref: "#/components/schemas/NewsItem" }
        historicalPrecedents:
          type: array
          items: { $ref: "#/components/schemas/HistoricalPrecedent" }
        thesis:
          $ref: "#/components/schemas/AnalysisThesis"
        riskLimits:
          $ref: "#/components/schemas/AnalysisRiskLimits"
        dataStatus: { type: string, enum: [live, partial, contextual, degraded] }
        newsSourceStatus: { type: string, enum: [live, partial, contextual, degraded] }
        newsSourceLabel: { type: string }
        newsSources:
          type: array
          items: { $ref: "#/components/schemas/NewsSource" }
        newsSourceCoverage:
          $ref: "#/components/schemas/NewsSourceCoverage"
        newsConflicts:
          type: array
          items: { $ref: "#/components/schemas/NewsConflict" }
        newsDuplicates:
          type: array
          items: { $ref: "#/components/schemas/NewsDuplicate" }
        masterDecision:
          $ref: "#/components/schemas/MasterDecisionSummary"
        fundamentalBrain:
          $ref: "#/components/schemas/FundamentalBrainResult"
      required: [symbol, name, price, decision, confidence, riskLevel, regime, explanation, technical, fundamental, risk, indicators, invalidation, news, historicalPrecedents, thesis, riskLimits, dataStatus, newsSourceStatus, newsSourceLabel, newsSources, newsSourceCoverage, newsConflicts, newsDuplicates, masterDecision, fundamentalBrain]
    FundamentalMetric:
      type: object
      properties:
        value: { type: number, nullable: true }
        score: { type: number, nullable: true }
        label: { type: string, enum: [attractive, fair, expensive, strong, neutral, weak, unavailable] }
      required: [value, score, label]
    FundamentalBrainResult:
      type: object
      properties:
        score: { type: number, nullable: true }
        confidence: { type: number }
        direction: { type: string, enum: [BUY, NEUTRAL, CAUTION, UNAVAILABLE] }
        metrics:
          type: object
          properties:
            pe: { $ref: "#/components/schemas/FundamentalMetric" }
            forwardPe: { $ref: "#/components/schemas/FundamentalMetric" }
            peg: { $ref: "#/components/schemas/FundamentalMetric" }
            epsGrowth: { $ref: "#/components/schemas/FundamentalMetric" }
            revenueGrowth: { $ref: "#/components/schemas/FundamentalMetric" }
            operatingMargin: { $ref: "#/components/schemas/FundamentalMetric" }
            roe: { $ref: "#/components/schemas/FundamentalMetric" }
            debtToEquity: { $ref: "#/components/schemas/FundamentalMetric" }
          required: [pe, forwardPe, peg, epsGrowth, revenueGrowth, operatingMargin, roe, debtToEquity]
        rationale: { type: string }
        warnings:
          type: array
          items: { type: string }
      required: [score, confidence, direction, metrics, rationale, warnings]
    MasterDecisionSummary:
      type: object
      properties:
        finalScore: { type: number, nullable: true }
        confidence: { type: number }
        decision: { type: string, enum: [BUY, SELL, WAIT, NO_TRADE] }
        sizeMultiplier: { type: number }
        hardVeto: { type: boolean }
        hardVetoReasons:
          type: array
          items: { type: string }
        softGuards:
          type: array
          items: { type: string }
        weightsUsed:
          type: object
          additionalProperties: { type: number }
        brainScores:
          type: object
          additionalProperties: { type: number, nullable: true }
        rationale: { type: string }
      required: [finalScore, confidence, decision, sizeMultiplier, hardVeto, hardVetoReasons, softGuards, weightsUsed, brainScores, rationale]
    AxiStageRules:
      type: object
      properties:
        stage: { type: string, enum: [PRE_SEED, SEED, INCUBATION, ACCELERATION, PRO, PRO_500, PRO_M] }
        minEquityUsd: { type: number }
        minEdgeScore: { type: number }
        profitTargetPct: { type: number, nullable: true }
        minDays: { type: number, nullable: true }
        minTrades: { type: number, nullable: true }
        maxLossPct: { type: number }
        leverage: { type: number, nullable: true }
      required: [stage, minEquityUsd, minEdgeScore, profitTargetPct, minDays, minTrades, maxLossPct, leverage]
    AxiRulesSnapshot:
      type: object
      properties:
        version: { type: string }
        verifiedAt: { type: string, format: date-time }
        sources:
          type: array
          items: { type: string }
        stages:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AxiStageRules" }
      required: [version, verifiedAt, sources, stages]
    AxiProgressResult:
      type: object
      properties:
        stage: { type: string }
        protectionMode: { type: string, enum: [NORMAL, PROFIT_LOCK_ACTIVE, RECOVERY, CAPITAL_PRESERVATION] }
        marketRegime: { type: string, enum: [GROWTH, BALANCED, DEFENSIVE, CRISIS] }
        edgeScore: { type: number, nullable: true }
        closedTrades: { type: number, nullable: true }
        stageDays: { type: number, nullable: true }
        currentEquity: { type: number, nullable: true }
        allocationEquity: { type: number, nullable: true }
        monthlyProfitPct: { type: number, nullable: true }
        stageProfitPct: { type: number, nullable: true }
        progressionReady: { type: boolean }
        baseSizeMultiplier: { type: number }
        reasons:
          type: array
          items: { type: string }
        rules: { $ref: "#/components/schemas/AxiStageRules" }
      required: [stage, protectionMode, marketRegime, edgeScore, closedTrades, stageDays, currentEquity, allocationEquity, monthlyProfitPct, stageProfitPct, progressionReady, baseSizeMultiplier, reasons, rules]
    RankedOpportunity:
      type: object
      properties:
        symbol: { type: string }
        decision: { type: string, enum: [BUY, SELL, WAIT, NO_TRADE] }
        finalScore: { type: number, nullable: true }
        opportunityScore: { type: number }
        expectancyR: { type: number, nullable: true }
        sizeMultiplier: { type: number }
        protectionMode: { type: string, enum: [NORMAL, PROFIT_LOCK_ACTIVE, RECOVERY, CAPITAL_PRESERVATION] }
        marketRegime: { type: string, enum: [GROWTH, BALANCED, DEFENSIVE, CRISIS] }
        reasons:
          type: array
          items: { type: string }
      required: [symbol, decision, finalScore, opportunityScore, expectancyR, sizeMultiplier, protectionMode, marketRegime, reasons]
    DecisionMemory:
      type: object
      properties:
        id: { type: number }
